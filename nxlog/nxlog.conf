############################################################
# NXLog CE: отправка событий Windows Security в login_mon
#
# Установка на Windows-сервере: см. README.md, раздел
# «Источник событий (NXLog)».
# Файл: C:\Program Files\nxlog\conf\nxlog.conf
#
# Перед установкой замените SYSLOG_SERVER на адрес хоста,
# где запущен docker compose (контейнер rsyslog, порт 1515).
############################################################

Panic Soft

define ROOT            C:\Program Files\nxlog
define LOGDIR          %ROOT%\data

define SYSLOG_SERVER   192.0.2.10
define SYSLOG_PORT     1515

LogFile                %LOGDIR%\nxlog.log

Moduledir              %ROOT%\modules
CacheDir               %LOGDIR%
Pidfile                %LOGDIR%\nxlog.pid
SpoolDir               %LOGDIR%

############################################################
# Extensions
############################################################

<Extension json>
    Module xm_json
</Extension>

<Extension syslog>
    Module xm_syslog
</Extension>

############################################################
# Windows Security
#
# Используются парсером: 4624, 4625, 4634, 4647, 4778, 4779.
# Пересылаются, но пока не используются: 4648, 4672, 4740
# (4672 - самое массовое из них, его можно убрать для
# уменьшения трафика).
#
# to_json() кладёт всё событие в $Message в виде JSON;
# парсер берёт JSON с первой "{" в строке syslog.
############################################################

<Input security>
    Module          im_msvistalog
    PollInterval    1
    <QueryXML>
        <QueryList><Query Id="0"><Select Path="Security">*[System[(EventID=4624 or EventID=4625 or EventID=4634 or EventID=4647 or EventID=4648 or EventID=4672 or EventID=4740 or EventID=4778 or EventID=4779)]]</Select></Query></QueryList>
    </QueryXML>
    <Exec>
        $Message = to_json();
    </Exec>
</Input>

############################################################
# Syslog -> rsyslog (TCP 1515)
############################################################

<Output rsyslog>
    Module om_tcp

    Host %SYSLOG_SERVER%
    Port %SYSLOG_PORT%

    Exec to_syslog_bsd();
</Output>

############################################################
# Route
############################################################

<Route security_to_rsyslog>
    Path security => rsyslog
</Route>
