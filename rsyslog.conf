global(
    dirCreateMode="0750"
    fileCreateMode="0640"
)

module(load="imtcp")

input(
    type="imtcp"
    port="1515"
    ruleset="windows_forward"
)

template(
    name="raw_file"
    type="string"
    string="/logs/raw/%fromhost-ip%/%$YEAR%-%$MONTH%-%$DAY%.log"
)

template(
    name="forward"
    type="string"
    string="%msg%\n"
)

ruleset(name="windows_forward") {

    action(
        type="omfile"
        dynaFile="raw_file"
        createDirs="on"
    )

    action(
        type="omfwd"
        target="winlog_parser"
        port="1516"
        protocol="tcp"
        template="forward"
    )
}
