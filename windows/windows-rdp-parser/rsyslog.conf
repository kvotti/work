global(
    dirCreateMode="0750"
    fileCreateMode="0640"
    # Файлы очереди пересылки парсеру (том ./spool в docker-compose.yml)
    workDirectory="/var/spool/rsyslog"
)

module(load="imtcp")

input(
    type="imtcp"
    port="1515"
    ruleset="windows_forward"
)

template(
    name="raw_file"
    type="string"
    string="/logs/raw/%fromhost-ip%/%$YEAR%-%$MONTH%-%$DAY%.log"
)

template(
    name="forward"
    type="string"
    string="%msg%\n"
)

ruleset(name="windows_forward") {

    action(
        type="omfile"
        dynaFile="raw_file"
        createDirs="on"
    )

    # Пересылка парсеру с очередью: пока парсер перезапускается или
    # недоступен, события копятся (в памяти, при переполнении и при
    # остановке rsyslog - на диске) и досылаются после восстановления.
    action(
        type="omfwd"
        target="winlog_parser"
        port="1516"
        protocol="tcp"
        template="forward"

        queue.type="LinkedList"
        queue.filename="parser_fwd"
        queue.size="100000"
        queue.maxDiskSpace="1g"
        queue.saveOnShutdown="on"
        action.resumeRetryCount="-1"
        action.resumeInterval="5"
    )
}
